<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
    <h2>User Registration Form</h2>

    <form action="#" method=" "POST">
    
     <label for="name">Name:</label>
    <input type="text" id="name" name="name" required> <br><br>
    
    <label form="email"> Email: </label>
    <input type="email" id="email" name="email" required> <br><br>
    
    <label for="password">Password:</label>
    <input type="password" name="password" minlength="6" required> <br><br>

    <label>Gender:</label> <br><br>
    <input type="radio" id="male" name="gender" value="male">
    <label for="gender">Male</label> 

    <input type="radio" id="female" name="gender" value="female">
    <label for="gender">Female</label> <br><br>

    <label>Intrests</label> <br><br>
    <input type="checkbox" id="sports" name="intrests" value="sports">
    <label for="intrests"> Sports </label> <br><br>

    <label Reading</label>
    <input type="checkbox" id="books" name="intrests" value="books">
    <label for="reading"> Books </label> <br><br>

    <label Music</label>
    <input type="checkbox" id="songs" name="intrests" value="songs">
    <label for="music"> Songs </label> <br><br>
    <input type="submit" value="submit">

    </form>
</body>
</html>
